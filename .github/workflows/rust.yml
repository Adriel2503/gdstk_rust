name: Rust CI

on: [push, pull_request]

jobs:
  test:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libqhull-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config qhull zlib

      - name: Configure pkg-config (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix qhull)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: johnwason/vcpkg-action@v6
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: x64-windows-static
          token: ${{ github.token }}
          github-binarycache: true

      - name: Build examples
        run: cargo build --release --examples
        working-directory: rust
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static

      - name: Run tests
        run: cargo test --release
        working-directory: rust
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static

  # La Library se lee desde varios hilos (tests/concurrency.rs). ThreadSanitizer
  # instrumenta el Rust (con -Zbuild-std) y el C++ de gdstk (CXXFLAGS, que el
  # crate cc toma solo). No bloquea: la libstdc++ del sistema no está
  # instrumentada y puede dar falsos positivos.
  tsan:
    name: ThreadSanitizer (no bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libqhull-dev

      - name: Concurrency tests under TSan
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --test concurrency
        working-directory: rust
        env:
          RUSTFLAGS: -Zsanitizer=thread
          CFLAGS: -fsanitize=thread
          CXXFLAGS: -fsanitize=thread
          TSAN_OPTIONS: halt_on_error=1
