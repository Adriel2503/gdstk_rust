name: Tests Runner

on: [push, pull_request]

jobs:
  # Solo Linux, la plataforma oficial de Riku.
  linux-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.14']
    name: Test for ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqhull-dev
      - name: Install python dependencies
        run: |
          pip install pip-tools pytest
          python -m piptools compile --resolver=backtracking -o requirements.txt pyproject.toml
          pip install -r requirements.txt
      - name: Build and install
        run: |
          python -m build -w
          mv gdstk gdstk_src
          pip install --no-index --find-links dist gdstk
      - name: Test
        run: python -m pytest
